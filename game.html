<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flip Card Memory Game - Play</title>
    <link rel="stylesheet" href="game-styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="game-container">
      <!-- Game Header -->
      <header class="game-header">
        <button class="back-button" aria-label="Go back to home">← Back</button>
        <div class="header-content">
          <h1 class="game-title">Let's play! 🎮</h1>
          <p class="topic-display" id="topicDisplay">Animals Memory Game</p>
        </div>
        <div class="game-stats">
          <div class="stat-item">
            <span class="stat-label">Moves:</span>
            <span class="stat-value" id="moveCount">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Matches:</span>
            <span class="stat-value" id="matchCount">0/10</span>
          </div>
        </div>
      </header>

      <!-- Game Board -->
      <section class="game-board" role="region" aria-label="Memory game board">
        <div class="cards-grid" id="cardsGrid">
          <!-- Cards will be generated by JavaScript -->
        </div>
      </section>

      <!-- Game Controls -->
      <section class="game-controls">
        <button class="control-button restart-button" id="restartButton">
          🔄 Restart Game
        </button>
        <button class="control-button shuffle-button" id="shuffleButton">
          🔀 Shuffle Cards
        </button>
      </section>

      <!-- Fun Fact Modal -->
      <div
        class="fun-fact-modal"
        id="funFactModal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="funFactTitle"
        style="display: none"
      >
        <div class="fun-fact-content">
          <div class="fun-fact-header">
            <h2 id="funFactTitle">Fun Fact! 🎯</h2>
            <div class="fun-fact-emoji" id="funFactEmoji">✨</div>
          </div>
          <p class="fun-fact-text" id="funFactText">Loading fun fact...</p>
          <div class="fun-fact-progress">
            <span id="funFactProgress">1 of 10</span>
          </div>
          <button class="fun-fact-button" id="funFactOkButton">OK</button>
        </div>
      </div>

      <!-- Win Modal -->
      <div
        class="win-modal"
        id="winModal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="winTitle"
        style="display: none"
      >
        <div class="win-content">
          <div class="win-emoji">🎉</div>
          <h2 id="winTitle">Congratulations!</h2>
          <p class="win-message">You completed the memory game!</p>
          <div class="win-stats">
            <p>Total moves: <span id="finalMoves">0</span></p>
            <p>Time: <span id="finalTime">0:00</span></p>
          </div>
          <div class="win-buttons">
            <button class="win-button play-again" id="playAgainButton">
              Play Again
            </button>
            <button class="win-button go-home" id="goHomeButton">Home</button>
          </div>
        </div>
      </div>
    </main>

    <script src="game-script.js"></script>
  </body>
</html>
